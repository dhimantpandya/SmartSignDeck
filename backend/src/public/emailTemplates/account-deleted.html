<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .header { background-color: #f44336; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; }
        .footer { text-align: center; font-size: 12px; color: #777; margin-top: 20px; }
        .btn { display: inline-block; background-color: #2196F3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Account Deleted</h1>
        </div>
        <div class="content">
            <p>Hello {{name}},</p>
            <p>Your account on <strong>SmartSignDeck</strong> has been deleted by an administrator.</p>
            <p>If you believe this was an error or if you wish to appeal this decision, please contact our support team immediately.</p>
            <a href="{{contactUrl}}" class="btn">Contact Us</a>
        </div>
        <div class="footer">
            <p>&copy; 2026 SmartSignDeck. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
